[project]
name = "bull-chess"
version = "0.2.0"
description = "Буга-Шыдыраа: тувинская настольная игра с ИИ и онлайн-комнатами"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet==0.80.5",
]

[dependency-groups]
dev = [
    "flet-cli==0.80.5",
    "flet-desktop==0.80.5",
    "flet-web==0.80.5",
]
packaging = ["pyinstaller>=6.22.2"]

[project.optional-dependencies]
server = ["flet-web==0.80.5"]

[tool.flet]
org = "com.mycompany"
product = "bull-chess"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"
